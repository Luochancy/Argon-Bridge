name: PHP Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Lint PHP files
        run: |
          for f in $(find . -name "*.php"); do
            php -l "$f"
          done
      - name: Run unit tests
        run: |
          php tests/signature.php
          php tests/bridge.php
